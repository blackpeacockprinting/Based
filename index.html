<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Based — Real Supplements. Real Science.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:ital,wght@0,300;0,400;0,500;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --black: #080808;
    --white: #F2EFE9;
    --green: #B8FF57;
    --gray: #111111;
    --card: #161616;
    --border: #222222;
    --muted: #555;
    --mid: #999;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.025;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,8,8,0.95);
    backdrop-filter: blur(16px);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 4px;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot { color: var(--green); }

  .beta-pill {
    background: rgba(184,255,87,.12);
    border: 1px solid rgba(184,255,87,.25);
    border-radius: 20px;
    padding: 3px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--green);
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .nav-right {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .12em;
  }

  /* ── Main layout ── */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 110px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* ── Search header ── */
  .search-header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp .5s ease forwards;
  }

  .search-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--green);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .search-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 88px);
    line-height: .95;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  .search-title .outline {
    -webkit-text-stroke: 1.5px var(--white);
    color: transparent;
  }

  .search-title .green { color: var(--green); }

  .search-sub {
    font-size: 14px;
    color: var(--mid);
    font-weight: 300;
    line-height: 1.6;
  }

  /* ── Search box ── */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
    animation: fadeUp .5s ease .1s both;
  }

  .search-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 18px 130px 18px 20px;
    font-size: 16px;
    color: var(--white);
    font-family: 'Archivo', sans-serif;
    font-weight: 300;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .search-input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(184,255,87,.08);
  }

  .search-input::placeholder { color: var(--muted); }

  .search-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--green);
    color: var(--black);
    border: none;
    border-radius: 4px;
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Archivo', sans-serif;
    text-transform: uppercase;
    letter-spacing: .06em;
    cursor: pointer;
    transition: opacity .15s;
    white-space: nowrap;
  }

  .search-btn:hover { opacity: .85; }
  .search-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ── Quick picks ── */
  .quick-wrap {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 48px;
    animation: fadeUp .5s ease .2s both;
  }

  .quick-label {
    width: 100%;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .quick-chip {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }

  .quick-chip:hover {
    border-color: var(--green);
    color: var(--green);
  }

  /* ── Result card ── */
  .result-wrap {
    animation: fadeUp .4s ease forwards;
  }

  .result-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  /* Header bar */
  .result-bar {
    background: var(--gray);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .result-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-aka {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .08em;
  }

  .efficacy-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

  .efficacy-badge {
    border-radius: 4px;
    padding: 5px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .badge-strong { background: rgba(184,255,87,.12); border: 1px solid rgba(184,255,87,.3); color: var(--green); }
  .badge-moderate { background: rgba(255,180,50,.10); border: 1px solid rgba(255,180,50,.3); color: #FFB432; }
  .badge-weak { background: rgba(255,100,80,.08); border: 1px solid rgba(255,100,80,.2); color: #FF6450; }
  .badge-insufficient { background: rgba(150,150,150,.08); border: 1px solid rgba(150,150,150,.2); color: var(--mid); }

  /* Category tags */
  .cat-row {
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .cat-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .cat-tag {
    border-radius: 3px;
    padding: 4px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: rgba(184,255,87,.07);
    border: 1px solid rgba(184,255,87,.18);
    color: var(--green);
  }

  /* Body */
  .result-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

  .lbl {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .summary-text {
    font-size: 14px;
    line-height: 1.8;
    color: #aaa;
    font-weight: 300;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 12px;
    text-align: center;
  }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--green);
    margin-bottom: 3px;
  }

  .stat-lbl {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  /* Uses */
  .uses-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .use-tag {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 10px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--mid);
  }

  /* Age grid */
  .age-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .age-box {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }

  .age-group {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--green);
    letter-spacing: .1em;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .age-text {
    font-size: 12px;
    color: #777;
    font-weight: 300;
    line-height: 1.55;
  }

  /* Alternatives */
  .alt-box {
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .alt-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--green);
    letter-spacing: .12em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .alt-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .alt-item:last-child { border-bottom: none; }

  .alt-check { color: var(--green); font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  .alt-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 3px;
  }

  .alt-reason {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.5;
  }

  /* Warning */
  .warn-box {
    background: rgba(255,100,80,.05);
    border: 1px solid rgba(255,100,80,.2);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .warn-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: #FF6450;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .warn-text {
    font-size: 12px;
    color: #888;
    font-weight: 300;
    line-height: 1.6;
  }

  /* Safety note */
  .safety-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 14px 16px;
    background: var(--gray);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
  }

  .safety-icon { flex-shrink: 0; }

  /* Source */
  .source-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .05em;
  }

  .source-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  /* Loading */
  .loading-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 56px 28px;
    text-align: center;
  }

  .loading-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--border);
    margin-bottom: 20px;
    animation: pulse 1.2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .3; }
    50% { opacity: .7; }
  }

  .loading-steps {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 240px;
    margin: 0 auto;
  }

  .loading-step {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .loading-step.active { color: var(--green); }

  .step-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .step-dot.spin-dot {
    background: transparent;
    border: 1.5px solid var(--green);
    border-top-color: transparent;
    animation: spin .6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error-card {
    background: var(--card);
    border: 1.5px solid rgba(255,100,80,.2);
    border-radius: 10px;
    padding: 32px 28px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #FF6450;
    letter-spacing: .05em;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .1em;
  }

  .empty-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 4px;
    color: var(--border);
    margin-bottom: 12px;
    display: block;
  }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--border); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    border-top: 1px solid var(--border);
    background: rgba(8,8,8,.95);
    backdrop-filter: blur(12px);
    padding: 10px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
  }

  .footer-left {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .footer-right {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .1em;
  }

  .footer-right span { color: var(--green); }

  /* Responsive */
  @media (max-width: 600px) {
    nav { padding: 14px 16px; }
    .main { padding: 90px 16px 80px; }
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .age-grid { grid-template-columns: 1fr; }
    .result-bar { flex-direction: column; gap: 12px; }
    .efficacy-wrap { flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="logo">
    BASED<span class="logo-dot">.</span>
    <div class="beta-pill">Beta</div>
  </div>
  <div class="nav-right">Real Supplements. Real Science.</div>
</nav>

<!-- Main -->
<div class="main">

  <!-- Header -->
  <div class="search-header">
    <div class="search-eyebrow">// NIH & PubMed Research Database</div>
    <div class="search-title">
      WHAT'S<br/>
      IN YOUR<br/>
      <span class="green">STACK<span class="outline">?</span></span>
    </div>
    <div class="search-sub">Search any supplement. Get the truth — no marketing, no BS, just what the research actually says.</div>
  </div>

  <!-- Search box -->
  <div class="search-wrap">
    <input
      class="search-input"
      type="text"
      id="search-input"
      placeholder="e.g. creatine, magnesium, pre-workout…"
      autocomplete="off"
    />
    <button class="search-btn" id="search-btn" onclick="doSearch()">Search →</button>
  </div>

  <!-- Quick picks -->
  <div class="quick-wrap">
    <div class="quick-label">Try these</div>
    <button class="quick-chip" onclick="quickSearch('Creatine')">Creatine</button>
    <button class="quick-chip" onclick="quickSearch('Magnesium')">Magnesium</button>
    <button class="quick-chip" onclick="quickSearch('Vitamin D')">Vitamin D</button>
    <button class="quick-chip" onclick="quickSearch('Ashwagandha')">Ashwagandha</button>
    <button class="quick-chip" onclick="quickSearch('Fish Oil')">Fish Oil</button>
    <button class="quick-chip" onclick="quickSearch('Pre-Workout')">Pre-Workout</button>
    <button class="quick-chip" onclick="quickSearch('Collagen')">Collagen</button>
    <button class="quick-chip" onclick="quickSearch('Lions Mane')">Lion's Mane</button>
  </div>

  <!-- Result area -->
  <div id="result-area"></div>

</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left">Based Beta — For research purposes only</div>
  <div class="footer-right">Data: <span>NIH / PubMed</span></div>
</div>

<script>
const PROMPT = (name) => `You are Based, a no-BS supplement research assistant powered by NIH and PubMed data.

The user searched for: "${name}"

Return ONLY a raw JSON object (absolutely no markdown, no backticks, no preamble):
{
  "name": "Full supplement name",
  "aka": "Common aliases (short, comma separated)",
  "efficacyRating": "Strong / Moderate / Weak / Insufficient Evidence",
  "categories": ["e.g. Muscle & Performance", "Brain & Cognition", "Sleep & Recovery", "Injury Recovery", "Natural Energy", "Joint & Bone Health", "Heart Health", "Immune Health", "Stress & Mood"],
  "summary": "3-4 sentence honest plain English summary of what peer-reviewed research actually shows. If evidence is weak or mixed, say so directly. No marketing language.",
  "primaryUses": ["use 1", "use 2", "use 3"],
  "typicalDosage": "e.g. 3–5g/day",
  "onsetTime": "e.g. 2–4 weeks",
  "studyCount": "e.g. 500+ or Limited (<20)",
  "ageInsights": {
    "18–30": "One honest sentence on benefit or relevance for this age group",
    "31–45": "One honest sentence",
    "46–60": "One honest sentence",
    "60+": "One honest sentence"
  },
  "isSafe": true,
  "safetyNote": "One sentence on who should be cautious or any known interactions",
  "unsafeWarning": "Only include if isSafe is false — brief explanation of concern",
  "safeAlternatives": [
    { "name": "Alternative name", "reason": "Why it's a safer or better-evidenced option" }
  ]
}

safeAlternatives should only be included when the searched supplement has safety concerns, weak evidence, or better alternatives exist. For well-studied safe supplements, return an empty array [].`;

let currentSearch = '';

async function doSearch() {
  const input = document.getElementById('search-input');
  const query = input.value.trim();
  if (!query) {
    input.style.borderColor = '#FF6450';
    setTimeout(() => input.style.borderColor = '', 1200);
    return;
  }
  currentSearch = query;
  await runSearch(query);
}

async function quickSearch(name) {
  document.getElementById('search-input').value = name;
  currentSearch = name;
  await runSearch(name);
}

async function runSearch(name) {
  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  showLoading(name);

  try {
    const res = await fetch(''https://us-central1-based-a8f50.cloudfunctions.net/supplement'', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: PROMPT(name) }]
      })
    });

    const data = await res.json();
    const text = data.content?.map(b => b.text || '').join('') || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);
    showResult(result);
  } catch (e) {
    showError();
  } finally {
    btn.disabled = false;
  }
}

function getBadgeClass(rating) {
  if (!rating) return 'badge-insufficient';
  const r = rating.toLowerCase();
  if (r.includes('strong')) return 'badge-strong';
  if (r.includes('moderate')) return 'badge-moderate';
  if (r.includes('weak')) return 'badge-weak';
  return 'badge-insufficient';
}

function showLoading(name) {
  document.getElementById('result-area').innerHTML = `
    <div class="result-wrap">
      <div class="loading-card">
        <div class="loading-name">${name.toUpperCase()}</div>
        <div class="loading-steps">
          <div class="loading-step active">
            <div class="step-dot spin-dot"></div>
            Searching NIH database
          </div>
          <div class="loading-step">
            <div class="step-dot"></div>
            Analyzing PubMed studies
          </div>
          <div class="loading-step">
            <div class="step-dot"></div>
            Generating plain English summary
          </div>
        </div>
      </div>
    </div>`;

  // Animate steps
  setTimeout(() => {
    const steps = document.querySelectorAll('.loading-step');
    if (steps[0]) { steps[0].querySelector('.step-dot').classList.remove('spin-dot'); steps[0].querySelector('.step-dot').style.background='var(--green)'; }
    if (steps[1]) { steps[1].classList.add('active'); steps[1].querySelector('.step-dot').classList.add('spin-dot'); }
  }, 800);

  setTimeout(() => {
    const steps = document.querySelectorAll('.loading-step');
    if (steps[1]) { steps[1].querySelector('.step-dot').classList.remove('spin-dot'); steps[1].querySelector('.step-dot').style.background='var(--green)'; }
    if (steps[2]) { steps[2].classList.add('active'); steps[2].querySelector('.step-dot').classList.add('spin-dot'); }
  }, 1600);
}

function showError() {
  document.getElementById('result-area').innerHTML = `
    <div class="result-wrap">
      <div class="error-card">⚠ Something went wrong — check your connection and try again.</div>
    </div>`;
}

function showResult(r) {
  const cats = (r.categories || []).map(c => `<div class="cat-tag">${c}</div>`).join('');
  const uses = (r.primaryUses || []).map(u => `<div class="use-tag">${u}</div>`).join('');

  const ageHTML = r.ageInsights ? Object.entries(r.ageInsights).map(([age, txt]) => `
    <div class="age-box">
      <div class="age-group">${age}</div>
      <div class="age-text">${txt}</div>
    </div>`).join('') : '';

  const altsHTML = r.safeAlternatives?.length ? `
    <div>
      <div class="lbl">Research-Backed Alternatives</div>
      <div class="alt-box">
        <div class="alt-header">✓ Better or Safer Options</div>
        ${r.safeAlternatives.map(a => `
          <div class="alt-item">
            <div class="alt-check">→</div>
            <div>
              <div class="alt-name">${a.name}</div>
              <div class="alt-reason">${a.reason}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const warnHTML = r.isSafe === false && r.unsafeWarning ? `
    <div class="warn-box">
      <div class="warn-title">⚠ Safety Notice</div>
      <div class="warn-text">${r.unsafeWarning}</div>
    </div>` : '';

  document.getElementById('result-area').innerHTML = `
    <div class="result-wrap">
      <div class="result-card">

        <div class="result-bar">
          <div>
            <div class="result-name">${r.name || currentSearch.toUpperCase()}</div>
            ${r.aka ? `<div class="result-aka">Also known as: ${r.aka}</div>` : ''}
          </div>
          <div class="efficacy-wrap">
            <div class="efficacy-badge ${getBadgeClass(r.efficacyRating)}">${r.efficacyRating || 'Unknown'}</div>
          </div>
        </div>

        ${cats ? `<div class="cat-row"><div class="cat-label">Categories</div>${cats}</div>` : ''}

        <div class="result-body">

          <div>
            <div class="lbl">What the Research Says</div>
            <div class="summary-text">${r.summary || 'No summary available.'}</div>
          </div>

          ${uses ? `<div><div class="lbl">Primary Uses</div><div class="uses-row">${uses}</div></div>` : ''}

          <div class="stats-row">
            <div class="stat">
              <div class="stat-val">${r.typicalDosage || '—'}</div>
              <div class="stat-lbl">Dosage</div>
            </div>
            <div class="stat">
              <div class="stat-val">${r.onsetTime || '—'}</div>
              <div class="stat-lbl">Onset Time</div>
            </div>
            <div class="stat">
              <div class="stat-val">${r.studyCount || '—'}</div>
              <div class="stat-lbl">Studies</div>
            </div>
          </div>

          ${ageHTML ? `<div><div class="lbl">Age Group Insights</div><div class="age-grid">${ageHTML}</div></div>` : ''}

          ${warnHTML}
          ${altsHTML}

          ${r.safetyNote ? `
            <div class="safety-row">
              <div class="safety-icon">🛡</div>
              <div>${r.safetyNote}</div>
            </div>` : ''}

          <div class="source-row">
            <div class="source-dot"></div>
            Data synthesized from NIH / PubMed peer-reviewed research literature
          </div>

        </div>
      </div>
    </div>`;

  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Enter key support
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
